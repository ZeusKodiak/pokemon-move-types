<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sammy's Pokédex</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1b1c1f;
    --muted: #6b6f76;
    --line: #e2e4e8;
    --accent: #d94b4b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --card: #1f2228;
      --text: #eceef1;
      --muted: #9aa0a8;
      --line: #2e323a;
      --accent: #e56b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem 1rem 4rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 46rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  .tagline { color: var(--muted); margin: 0 0 1.5rem; }

  form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  input, button {
    font: inherit;
    padding: 0.6rem 0.8rem;
    border-radius: 0.5rem;
    border: 1px solid var(--line);
  }
  input { flex: 1; min-width: 0; background: var(--card); color: var(--text); }
  button {
    background: var(--accent);
    border-color: transparent;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  button:disabled { opacity: 0.6; cursor: default; }

  .status { color: var(--muted); }
  .status.error { color: var(--accent); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.75rem;
    padding: 1.25rem;
  }
  .head { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .head img { width: 96px; height: 96px; image-rendering: pixelated; }
  .head h2 { margin: 0; font-size: 1.35rem; text-transform: capitalize; }
  .dex { color: var(--muted); font-variant-numeric: tabular-nums; }

  .types { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.4rem; }
  .type {
    display: inline-block;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: capitalize;
    color: #fff;
    text-shadow: 0 1px 1px rgba(0,0,0,0.35);
    white-space: nowrap;
  }

  h3 { margin: 1.75rem 0 0.5rem; font-size: 1rem; }
  h3 .note { font-weight: 400; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left;
    padding: 0.5rem 0.4rem;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  th { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  td.name { text-transform: capitalize; min-width: 11rem; }
  td.name .damage { text-transform: none; max-width: 26rem; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .damage { color: var(--muted); font-size: 0.85rem; text-transform: capitalize; }
  .scroll { overflow-x: auto; }

  #pickerBox { margin-bottom: 1.5rem; }
  #pickerCount { margin: 0 0 0.4rem; font-size: 0.85rem; }
  .picker {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 15rem;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.5rem;
  }
  .picker li { border-bottom: 1px solid var(--line); }
  .picker li:last-child { border-bottom: 0; }
  .picker button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--text);
    font-weight: 400;
    text-transform: capitalize;
    /* Comfortable tap target on a phone. */
    padding: 0.7rem 0.8rem;
  }
  .picker button:hover, .picker button:focus { background: var(--line); }
  .picker .dexnum { color: var(--muted); font-variant-numeric: tabular-nums; }

  .region { color: var(--muted); }

  /* Evolution line: one column per stage, side by side, arrows between. A
     branching line (Eevee, Wurmple) stacks its options within one column, and
     columns are centred rather than stretched, so a one-member stage sits level
     with the middle of a branching one instead of growing to match its height. */
  .evo { display: flex; align-items: center; gap: 0.5rem; width: max-content; }
  .evo-stage { display: flex; flex-direction: column; gap: 0.5rem; }
  .evo-arrow { color: var(--muted); }
  .evo-member {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.1rem;
    width: 7.5rem;
    padding: 0.5rem 0.4rem;
    border-radius: 0.5rem;
    background: none;
    border: 1px solid transparent;
    color: var(--text);
    font-weight: 400;
    text-align: center;
  }
  .evo-member:hover, .evo-member:focus { border-color: var(--line); background: var(--bg); }
  .evo-member.current { border-color: var(--accent); }
  .evo-member img { width: 64px; height: 64px; image-rendering: pixelated; }
  .evo-name { text-transform: capitalize; }
  .evo-how { color: var(--muted); font-size: 0.8rem; line-height: 1.3; }
</style>
</head>
<body>
<main>
  <h1>Sammy's Pokédex</h1>
  <p class="tagline">Pick a Pokémon from the list to see its region, its types, its evolution line, and its main moves — and what type each move is. Type in the box to narrow the list down.</p>

  <form id="search">
    <input id="query" name="query" placeholder="Start typing, or scroll the list" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit">Look up</button>
  </form>

  <div id="pickerBox">
    <p id="pickerCount" class="status"></p>
    <ul id="picker" class="picker"></ul>
  </div>

  <p id="status" class="status"></p>
  <div id="result"></div>
</main>

<script>
const API = "https://pokeapi.co/api/v2";

// Where PokéAPI's own sprite URLs point. Building them by dex number here saves
// a request per member of an evolution line just to find the picture.
const SPRITES = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon";

// Official type colours, used for the type pills.
const TYPE_COLOURS = {
  normal: "#9fa19f", fire: "#e8722c", water: "#3692dc", electric: "#e5c531",
  grass: "#4fa64f", ice: "#4fbdbd", fighting: "#c03028", poison: "#9141cb",
  ground: "#d97845", flying: "#8fa8dd", psychic: "#e56399", bug: "#8cb230",
  rock: "#b8a038", ghost: "#6f4570", dragon: "#5361ad", dark: "#5b5366",
  steel: "#5f8f9f", fairy: "#e397d1",
};

// PokéAPI groups Pokémon by generation, not by region, so map across. Each
// generation was introduced in exactly one region.
const REGIONS = {
  "generation-i": "Kanto", "generation-ii": "Johto", "generation-iii": "Hoenn",
  "generation-iv": "Sinnoh", "generation-v": "Unova", "generation-vi": "Kalos",
  "generation-vii": "Alola", "generation-viii": "Galar", "generation-ix": "Paldea",
};

// Long lists are slow to render on a phone, so cap what is shown at once.
const MAX_LISTED = 200;

const form = document.getElementById("search");
const queryInput = document.getElementById("query");
const submitButton = form.querySelector("button");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const pickerEl = document.getElementById("picker");
const pickerCountEl = document.getElementById("pickerCount");

// Move details are fetched one request per move, so cache them across lookups.
const moveCache = new Map();

// Every Pokémon name, fetched once so filtering happens locally with no lag.
let allPokemon = [];

form.addEventListener("submit", (event) => {
  event.preventDefault();
  if (!queryInput.value.trim()) return;
  // Enter on a narrowed list should pick the top match, so a near-miss
  // spelling still works without having to get it exactly right.
  const matches = filterPokemon(queryInput.value);
  lookup(matches.length ? matches[0].name : queryInput.value);
});

queryInput.addEventListener("input", () => renderPicker(queryInput.value));

pickerEl.addEventListener("click", pickFromButton);

// The evolution line is made of the same data-name buttons, so a member of it
// can be looked up by tapping it.
resultEl.addEventListener("click", pickFromButton);

function pickFromButton(event) {
  const button = event.target.closest("button[data-name]");
  if (!button) return;
  queryInput.value = button.dataset.name;
  lookup(button.dataset.name);
}

async function loadPokemonList() {
  const data = await fetchJSON(`${API}/pokemon?limit=100000`);
  allPokemon = data.results.map((entry) => ({
    name: entry.name,
    // The dex number is the last path segment of the entry's URL.
    id: Number(entry.url.replace(/\/$/, "").split("/").pop()),
  }));
  renderPicker(queryInput.value);
}

function filterPokemon(rawQuery) {
  const needle = rawQuery.trim().toLowerCase().replace(/[\s-]/g, "");
  if (!needle) return allPokemon;
  const matches = allPokemon.filter(
    (p) => p.name.replace(/-/g, "").includes(needle) || String(p.id) === needle
  );
  // Names that start with what was typed are the likelier intent, so float
  // them up: typing "char" should offer Charmander before Wartortle.
  return matches.sort((a, b) => {
    const aStarts = a.name.startsWith(needle);
    const bStarts = b.name.startsWith(needle);
    return aStarts === bStarts ? a.id - b.id : aStarts ? -1 : 1;
  });
}

function renderPicker(rawQuery) {
  if (!allPokemon.length) {
    pickerCountEl.textContent = "Loading the Pokémon list…";
    return;
  }

  const matches = filterPokemon(rawQuery);
  const shown = matches.slice(0, MAX_LISTED);

  pickerEl.innerHTML = shown
    .map(
      (p) => `<li><button type="button" data-name="${escapeHTML(p.name)}">
        ${escapeHTML(p.name.replace(/-/g, " "))}
        <span class="dexnum">#${String(p.id).padStart(4, "0")}</span>
      </button></li>`
    )
    .join("");

  if (!matches.length) {
    pickerCountEl.textContent = `Nothing matches "${rawQuery.trim()}".`;
  } else if (matches.length > shown.length) {
    pickerCountEl.textContent =
      `Showing ${shown.length} of ${matches.length} — keep typing to narrow it down.`;
  } else {
    pickerCountEl.textContent = `${matches.length} match${matches.length === 1 ? "" : "es"}.`;
  }
}

async function lookup(rawQuery) {
  const name = rawQuery.trim().toLowerCase().replace(/\s+/g, "-");
  if (!name) return;

  submitButton.disabled = true;
  resultEl.innerHTML = "";
  setStatus("Looking up " + name + "…");

  try {
    const pokemon = await fetchJSON(`${API}/pokemon/${encodeURIComponent(name)}`);
    setStatus("Loading moves…");
    const [moves, extras] = await Promise.all([
      loadMainMoves(pokemon),
      loadSpeciesExtras(pokemon),
    ]);
    render(pokemon, moves, extras);
    setStatus("");
    location.hash = pokemon.name;
  } catch (error) {
    const message = error.status === 404
      ? `No Pokémon called "${name}". Check the spelling — forms need a suffix, like "deoxys-normal".`
      : `Couldn't load that: ${error.message}`;
    setStatus(message, true);
  } finally {
    submitButton.disabled = false;
  }
}

// The region and the evolution line both hang off the species rather than the
// Pokémon, so one species request feeds both. A failure here should not lose
// the moves, so each part falls back to nothing rather than throwing.
async function loadSpeciesExtras(pokemon) {
  let species;
  try {
    species = await fetchJSON(pokemon.species.url);
  } catch {
    return { region: "", evolution: null };
  }

  const region = REGIONS[species.generation.name] || "";

  try {
    const chain = await fetchJSON(species.evolution_chain.url);
    return { region, evolution: toStages(chain.chain) };
  } catch {
    return { region, evolution: null };
  }
}

// The chain arrives as a tree — each node holding the species it evolves into —
// but it reads best as stages laid left to right, so flatten it a level at a
// time. Everything at the same depth is the same stage.
function toStages(root) {
  const stages = [];
  let level = [root];
  while (level.length) {
    stages.push(level.map((node) => ({
      name: node.species.name,
      // The species id is the last path segment of its URL, and the sprite
      // files are named by it, so no extra request is needed for the picture.
      id: Number(node.species.url.replace(/\/$/, "").split("/").pop()),
      how: describeEvolution(node.evolution_details),
    })));
    level = level.flatMap((node) => node.evolves_to);
  }
  return stages;
}

// A species can have several routes to the same evolution (Espeon by friendship
// in one game, by an item in another), so describe each and join them.
function describeEvolution(details) {
  const ways = [...new Set(details.map(describeOneEvolution).filter(Boolean))];
  // Only the first way starts the sentence, so the rest read on in lower case:
  // "Use Leaf Stone, or level up at moss rock".
  return ways
    .map((way, i) => (i === 0 ? way : way.charAt(0).toLowerCase() + way.slice(1)))
    .join(", or ");
}

function describeOneEvolution(detail) {
  const parts = [];
  const trigger = detail.trigger?.name;

  if (trigger === "level-up") {
    parts.push(detail.min_level ? `Level ${detail.min_level}` : "Level up");
  } else if (trigger === "use-item") {
    parts.push(`Use ${titleCase(detail.item?.name)}`);
  } else if (trigger === "trade") {
    parts.push("Trade");
  } else if (trigger === "shed") {
    parts.push("Level 21 with a spare party slot and Poké Ball");
  } else if (trigger === "three-critical-hits") {
    parts.push("Land three critical hits in one battle");
  } else if (trigger === "take-damage") {
    parts.push("Take damage in a particular place");
  } else if (trigger === "other") {
    parts.push("A one-off method");
  } else if (trigger) {
    parts.push(prettify(trigger));
  }

  // Everything below is a condition layered on top of the trigger, so the
  // wording is designed to read on from it: "Level 16 during the night".
  if (detail.held_item) parts.push(`holding ${titleCase(detail.held_item.name)}`);
  if (detail.trade_species) parts.push(`for ${titleCase(detail.trade_species.name)}`);
  if (detail.min_happiness) parts.push("with high friendship");
  if (detail.min_affection) parts.push("with high affection");
  if (detail.min_beauty) parts.push("with high beauty");
  if (detail.known_move) parts.push(`knowing ${titleCase(detail.known_move.name)}`);
  if (detail.known_move_type) parts.push(`knowing a ${prettify(detail.known_move_type.name)} move`);
  if (detail.location) parts.push(`at ${prettify(detail.location.name)}`);
  if (detail.time_of_day) parts.push(`during the ${detail.time_of_day}`);
  if (detail.gender === 1) parts.push("female only");
  if (detail.gender === 2) parts.push("male only");
  if (detail.needs_overworld_rain) parts.push("while it is raining");
  if (detail.party_species) parts.push(`with ${titleCase(detail.party_species.name)} in the party`);
  if (detail.party_type) parts.push(`with a ${prettify(detail.party_type.name)} type in the party`);
  if (detail.relative_physical_stats === 1) parts.push("with Attack above Defense");
  if (detail.relative_physical_stats === 0) parts.push("with Attack equal to Defense");
  if (detail.relative_physical_stats === -1) parts.push("with Attack below Defense");
  if (detail.turn_upside_down) parts.push("with the console turned upside down");

  return parts.join(" ");
}

// API names are lowercase and hyphenated; spaces read better in a sentence.
function prettify(name) {
  return String(name || "").replace(/-/g, " ");
}

// Items, moves and species are proper names in the games — "Use Thunder Stone"
// rather than "use thunder stone".
function titleCase(name) {
  return prettify(name).replace(/\b[a-z]/g, (char) => char.toUpperCase());
}

async function fetchJSON(url) {
  const response = await fetch(url);
  if (!response.ok) {
    const error = new Error(`request failed (${response.status})`);
    error.status = response.status;
    throw error;
  }
  return response.json();
}

// "Main moves" = the strongest-hitting moves it can learn, since the API has no
// notion of a signature or competitive moveset. Level-up moves first, because a
// species' level-up list is the closest thing to a characteristic moveset;
// TM/tutor/egg moves fill the rest of the table.
async function loadMainMoves(pokemon) {
  const levelUp = [];
  const other = [];
  for (const entry of pokemon.moves) {
    const learnedByLevel = entry.version_group_details.some(
      (detail) => detail.move_learn_method.name === "level-up"
    );
    (learnedByLevel ? levelUp : other).push(entry.move);
  }

  const candidates = [...levelUp, ...other].slice(0, 60);
  const details = await Promise.all(candidates.map(loadMove));

  return {
    // Damaging moves rank by base power.
    damaging: details
      .filter((move) => move.power !== null)
      .sort((a, b) => b.power - a.power || a.name.localeCompare(b.name))
      .slice(0, 12),
    // Status moves have no power to rank by, so they keep candidate order —
    // level-up moves first, which is the most characteristic of the species.
    status: details
      .filter((move) => move.damageClass === "status")
      .slice(0, 10),
  };
}

async function loadMove(ref) {
  if (!moveCache.has(ref.name)) {
    moveCache.set(ref.name, fetchJSON(ref.url).then((move) => ({
      name: move.name,
      power: move.power,
      accuracy: move.accuracy,
      pp: move.pp,
      type: move.type.name,
      damageClass: move.damage_class.name,
      effect: shortEffect(move),
    })));
  }
  return moveCache.get(ref.name);
}

// Status moves are unreadable without knowing what they do, so pull the
// one-line effect summary and fill in the move's own effect chance.
function shortEffect(move) {
  const entry = move.effect_entries.find((e) => e.language.name === "en");
  if (!entry) return "";
  return entry.short_effect.replace(/\$effect_chance/g, move.effect_chance);
}

function render(pokemon, moves, { region, evolution }) {
  const sprite =
    pokemon.sprites.other?.["official-artwork"]?.front_default ||
    pokemon.sprites.front_default;

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="head">
      ${sprite ? `<img src="${sprite}" alt="${pokemon.name}">` : ""}
      <div>
        <h2>${pokemon.name.replace(/-/g, " ")}</h2>
        <div class="dex">
          #${String(pokemon.id).padStart(4, "0")}
          ${region ? `<span class="region">· ${escapeHTML(region)} region</span>` : ""}
        </div>
        <div class="types">${pokemon.types.map((t) => typePill(t.type.name)).join("")}</div>
      </div>
    </div>

    ${evolutionSection(evolution, pokemon.species.name)}

    <h3>Attacking moves <span class="note">— highest-power moves it can learn</span></h3>
    ${moves.damaging.length
      ? moveTable(moves.damaging)
      : "<p class='status'>No damaging moves found for this Pokémon.</p>"}

    <h3>Status moves <span class="note">— non-damaging moves it can learn</span></h3>
    ${moves.status.length
      ? moveTable(moves.status)
      : "<p class='status'>No status moves found for this Pokémon.</p>"}
  `;
  resultEl.appendChild(card);
}

// `current` is the species name, not the Pokémon name, so alternate forms
// (deoxys-attack, giratina-origin) still highlight their place in the line.
function evolutionSection(stages, current) {
  const heading = "<h3>Evolution line</h3>";

  if (!stages) {
    return `${heading}<p class="status">Couldn't load the evolution line.</p>`;
  }
  if (stages.length < 2) {
    return `${heading}
      <div class="evo">${evoStage(stages[0], current)}</div>
      <p class="status">This Pokémon doesn't evolve.</p>`;
  }

  const columns = stages
    .map((stage) => evoStage(stage, current))
    .join('<div class="evo-arrow">→</div>');
  return `${heading}<div class="scroll"><div class="evo">${columns}</div></div>`;
}

function evoStage(stage, current) {
  const members = stage.map((member) => `
    <button type="button" class="evo-member${member.name === current ? " current" : ""}"
            data-name="${escapeHTML(member.name)}">
      <img src="${SPRITES}/${member.id}.png" alt="" loading="lazy">
      <span class="evo-name">${escapeHTML(prettify(member.name))}</span>
      ${member.how ? `<span class="evo-how">${escapeHTML(member.how)}</span>` : ""}
    </button>
  `).join("");
  return `<div class="evo-stage">${members}</div>`;
}

function moveTable(moves) {
  const rows = moves.map((move) => `
    <tr>
      <td class="name">
        ${escapeHTML(move.name.replace(/-/g, " "))}
        <div class="damage">${escapeHTML(
          move.damageClass === "status" && move.effect ? move.effect : move.damageClass
        )}</div>
      </td>
      <td>${typePill(move.type)}</td>
      <td class="num">${move.power === null ? "—" : move.power}</td>
      <td class="num">${move.accuracy === null ? "—" : move.accuracy + "%"}</td>
      <td class="num">${move.pp}</td>
    </tr>
  `).join("");

  return `<div class="scroll"><table>
    <thead><tr><th>Move</th><th>Type</th><th>Power</th><th>Acc.</th><th>PP</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function typePill(name) {
  const colour = TYPE_COLOURS[name] || "#777";
  return `<span class="type" style="background:${colour}">${escapeHTML(name)}</span>`;
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, (char) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[char]));
}

function setStatus(message, isError = false) {
  statusEl.textContent = message;
  statusEl.classList.toggle("error", isError);
}

// Allow deep links like index.html#gengar, and a default so the page isn't blank.
const initial = decodeURIComponent(location.hash.slice(1)) || "pikachu";
lookup(initial);

// The list is a separate request, so let it load alongside the first lookup
// rather than holding the page up. The box starts empty so the full list shows.
loadPokemonList().catch(() => {
  pickerCountEl.textContent = "Couldn't load the Pokémon list — typing a name still works.";
});
</script>
</body>
</html>
